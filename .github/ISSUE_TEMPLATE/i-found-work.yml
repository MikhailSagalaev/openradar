name: "🎉 Я нашёл заказ через openradar"
description: "История для стены историй: как лента помогла найти работу"
title: "[История] "
labels: ["story-proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо! Такие истории — главный аргумент для следующих участников.
        Карточка попадёт на стену только после проверки мейнтейнером (лейбл
        `on-the-record`), и в ней будет только то, что вы напишете здесь.
        Не указывайте контакты клиентов и всё, что не хотите публиковать.
  - type: input
    id: name
    attributes:
      label: "Как вас подписать"
      description: "Имя или ник. Пусто — подпишем «участник openradar»."
      placeholder: "Алексей (@alexdev)"
    validations:
      required: false
  - type: dropdown
    id: channel
    attributes:
      label: "Как нашли заказ"
      options:
        - "Лента на сайте"
        - "RSS или категория"
        - "Signals (уведомления)"
        - "MCP или ИИ-агент"
        - "Расширение для браузера"
        - "Свой узел"
        - "Другое"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: "Что это было"
      options:
        - "Заказ (фриланс)"
        - "Вакансия"
        - "Несколько заказов"
    validations:
      required: true
  - type: checkboxes
    id: helped
    attributes:
      label: "Что помогло"
      options:
        - "Скор и фильтры отсеяли шум"
        - "Уведомления пришли раньше откликов других"
        - "Контакты были прямо в посте"
        - "Оценка оплаты рынка"
        - "Просто вовремя увидел"
  - type: textarea
    id: story
    attributes:
      label: "История"
      description: "Пара предложений: что за заказ, как быстро, что бы вы сказали сомневающимся."
      placeholder: "Увидел заказ в ленте через 12 минут после публикации, откликнулся первым, договорились за день…"
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: "Согласие на публикацию"
      options:
        - label: "Я согласен, что этот текст будет опубликован на стене историй и в README с указанием подписи выше."
          required: true
