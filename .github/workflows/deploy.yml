name: Deploy hub

# Deploys main to the hub server over SSH after CI passes on main, or by hand.
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   DEPLOY_HOST         server address
#   DEPLOY_USER         SSH user (with docker rights)
#   DEPLOY_SSH_KEY      private key for that user (a dedicated deploy key)
#   DEPLOY_PORT         optional, default 22
#   DEPLOY_KNOWN_HOSTS  optional, output of `ssh-keyscan <host>`; pins the host key
# Repository variable (Settings -> Secrets and variables -> Actions -> Variables):
#   DEPLOY_DIR          optional, checkout directory on the server, default /opt/radar

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-hub
  cancel-in-progress: false

jobs:
  deploy:
    # Only CI runs of pushes to this repository: a fork's pull request from a branch
    # also named main triggers workflow_run too, and must not reach the deploy secrets.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: check
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          # Forks and fresh clones have no deploy target: skip quietly instead of failing.
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ]; then
            echo "::notice::Deploy skipped: set DEPLOY_HOST, DEPLOY_USER and DEPLOY_SSH_KEY to enable it"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure SSH
        if: steps.check.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          if [ -n "$KNOWN" ]; then printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts; else ssh-keyscan -p "${PORT:-22}" "$HOST" > ~/.ssh/known_hosts; fi
      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          DIR: ${{ vars.DEPLOY_DIR }}
        run: |
          ssh -i ~/.ssh/deploy -p "${PORT:-22}" -o BatchMode=yes "$USER@$HOST" "RADAR_DIR=${DIR:-/opt/radar} bash -s" < deploy-server.sh
      - name: Public health check
        if: steps.check.outputs.ready == 'true'
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "${{ vars.DEPLOY_HEALTH_URL || 'https://openradar.fun/health' }}"; then exit 0; fi
            sleep 5
          done
          echo "::warning::https://openradar.fun/health did not answer; check nginx"
