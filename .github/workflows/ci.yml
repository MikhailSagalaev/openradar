name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The ParadeDB image of the paradedb job; docker-compose.yml pins the same tag.
env:
  PARADEDB_IMAGE: paradedb/paradedb:0.26.8-pg18

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Moscow
    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_DB: radar_test
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Known vulnerabilities in production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Check that package.json, src/version.ts and server.json agree on the version
        run: node scripts/check-version.js
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Run tests against the in-memory store
        run: pnpm test
      - name: Run tests against PostgreSQL (pgvector, tsvector search fallback)
        env:
          RADAR_TEST_STORE: postgres
          DATABASE_URL: postgres://radar:test_password@127.0.0.1:5432/radar_test
        run: pnpm test
      - name: Python SDK
        run: pnpm test:python
      - run: pnpm build
      - name: Pack the browser extension
        run: pnpm pack:extension

  # The advertised minimum (engines: node >=22.19, .nvmrc 22): typecheck and in-memory tests.
  node22:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Moscow
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Run tests against the in-memory store
        run: pnpm test

  # The search path production runs: ParadeDB pg_search (BM25, `@@@`, paradedb.score).
  # Started by hand rather than as a service: the server needs
  # shared_preload_libraries=pg_search, as in docker-compose.yml.
  paradedb:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Moscow
    steps:
      - uses: actions/checkout@v7
      - name: Start ParadeDB
        run: |
          docker run -d --name paradedb -p 5432:5432 --shm-size=512m \
            -e POSTGRES_DB=radar_test -e POSTGRES_USER=radar -e POSTGRES_PASSWORD=test_password \
            "$PARADEDB_IMAGE" postgres -c shared_preload_libraries=pg_search
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for ParadeDB
        run: |
          for i in $(seq 1 60); do
            docker exec paradedb pg_isready -U radar -d radar_test -h 127.0.0.1 && exit 0
            sleep 2
          done
          docker logs paradedb
          exit 1
      - name: Run tests against PostgreSQL with pg_search
        env:
          RADAR_TEST_STORE: postgres
          DATABASE_URL: postgres://radar:test_password@127.0.0.1:5432/radar_test
        run: pnpm test
      - name: The BM25 index was built (the pg_search branch really ran)
        run: |
          docker exec paradedb psql -U radar -d radar_test -tAc \
            "SELECT count(*) FROM pg_indexes WHERE indexname = 'idx_leads_paradedb'" | grep -qx 1
