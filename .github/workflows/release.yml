name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  # Rebuild the release of an existing tag, e.g. after fixing this workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag, e.g. v0.8.1
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Extract tag version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then echo "::error::not a release tag: $TAG"; exit 1; fi
          CLEAN_VER=${TAG#v}
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${CLEAN_VER}" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install & Build App
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Sync extension version & package zip
        run: |
          VER="${{ steps.version.outputs.version }}"
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('extension/manifest.json', 'utf8'));
            manifest.version = '$VER';
            fs.writeFileSync('extension/manifest.json', JSON.stringify(manifest, null, 2));
          "
          cd extension && zip -r ../radar-extension-${{ steps.version.outputs.tag }}.zip ./* && cd ..

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Release notes from CHANGELOG.md
        run: |
          # The section of this version, up to the next "## " heading.
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 == "## " v { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "See CHANGELOG.md." > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OpenRadar ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          files: |
            radar-extension-${{ steps.version.outputs.tag }}.zip
          overwrite_files: true

      # Runs only where the Chrome Web Store secrets are set; forks skip it.
      # Installed copies update themselves once the store approves the version.
      - name: Publish the extension to the Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          if [ -z "$EXTENSION_ID" ]; then echo "Chrome Web Store secrets are not set; skipping."; exit 0; fi
          npx --yes chrome-webstore-upload-cli@4.0.2 upload publish --source "radar-extension-${{ steps.version.outputs.tag }}.zip"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the Docker image
        run: |
          # Image names must be lowercase; the owner is not.
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          # The source label links the package to this repository, which lets
          # GITHUB_TOKEN publish it.
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${{ steps.version.outputs.version }}" \
            -t "$IMAGE:${{ steps.version.outputs.tag }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ steps.version.outputs.tag }}"
          docker push "$IMAGE:latest"

