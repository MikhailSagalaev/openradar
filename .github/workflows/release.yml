name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract tag version
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          CLEAN_VER=${TAG#v}
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${CLEAN_VER}" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install & Build App
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Sync extension version & package zip
        run: |
          VER="${{ steps.version.outputs.version }}"
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('extension/manifest.json', 'utf8'));
            manifest.version = '$VER';
            fs.writeFileSync('extension/manifest.json', JSON.stringify(manifest, null, 2));
          "
          cd extension && zip -r ../radar-extension-${{ steps.version.outputs.tag }}.zip ./* && cd ..

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Release notes from CHANGELOG.md
        run: |
          # The section of this version, up to the next "## " heading.
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 == "## " v { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "See CHANGELOG.md." > release-notes.md

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the Docker image
        run: |
          # Image names must be lowercase; the owner is not.
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build -t "$IMAGE:${{ steps.version.outputs.tag }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ steps.version.outputs.tag }}"
          docker push "$IMAGE:latest"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OpenRadar ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          files: |
            radar-extension-${{ steps.version.outputs.tag }}.zip
