# Bot budgets and the anonymous microcache for an openradar hub (nginx >= 1.17.6).
# Install to /etc/nginx/conf.d/openradar-bots.conf — the http-level maps/zones below are
# shared by every server block; the location snippets are included per site.
# Rationale and measured numbers: docs/OPS_BOT_AND_MEMORY.md.
#
# Principles (see the doc for sources):
#  * Classify by UA TOKEN: GPTBot (training) != OAI-SearchBot (search) != ChatGPT-User
#    (a person waiting on the other side). Each family gets its own budget.
#  * Key zones by VENDOR, not IP: crawlers fan out over many addresses, so a per-IP cap
#    never bites the aggregate. An empty key is not counted — people are untouched.
#  * Over budget: 429 + Retry-After (RFC 6585). Never 403 (drops AI-search visibility),
#    never 503 (reads as "site down"). robots.txt is never limited (RFC 9309).
#  * Googlebot/bingbot/YandexBot get NO zone: steady-state throttling of search engines
#    costs indexing; Google documents 429 as a 1–2-day emergency valve only.
#
# NOTE: limit_req_status is set per-server in nginx.example.conf (429). Do NOT set it
# here at http level: a shared box may already define it (e.g. security.conf), and a
# duplicate http-level directive fails nginx -t.

# --- classification ---------------------------------------------------------
map $http_user_agent $radar_ai_search {
    default                    "";
    ~*OAI-SearchBot            oai-searchbot;
    ~*Claude-SearchBot         claude-searchbot;
    ~*PerplexityBot            perplexitybot;
}
map $http_user_agent $radar_ai_training {
    default                    "";
    ~*GPTBot                   gptbot;
    ~*ClaudeBot                claudebot;
    ~*CCBot                    ccbot;
    ~*Bytespider               bytespider;
    ~*meta-externalagent       meta;
    ~*Amazonbot                amazonbot;
    ~*Applebot                 applebot;
    ~*ElevenlabsCrawler        elevenlabs;
    ~*Reflectionbot            reflection;
    ~*cohere-ai                cohere;
    ~*Diffbot                  diffbot;
    ~*ImagesiftBot             imagesift;
    ~*Omgilibot                omgili;
    ~*Timpibot                 timpi;
    ~*webzio                   webzio;
}
map $http_user_agent $radar_ai_user {
    default                    "";
    ~*ChatGPT-User             chatgpt-user;
    ~*Claude-User              claude-user;
    ~*Perplexity-User          perplexity-user;
}
map $http_user_agent $radar_seo_tool {
    default                    "";
    ~*SemrushBot               semrush;
    ~*AhrefsBot                ahrefs;
    ~*MJ12bot                  mj12;
    ~*DotBot                   dotbot;
    ~*BLEXBot                  blex;
    ~*DataForSeoBot            dataforseo;
    ~*PetalBot                 petal;
}

# --- budgets (from measured traffic, with headroom) --------------------------
limit_req_zone $radar_ai_search   zone=radar_ai_search:1m   rate=2r/s;
limit_req_zone $radar_ai_training zone=radar_ai_train:1m    rate=30r/m;
limit_req_zone $radar_ai_user     zone=radar_ai_user:1m     rate=5r/s;
limit_req_zone $radar_seo_tool    zone=radar_seo_tools:1m   rate=6r/m;
# Rollout switch: dry run logs what WOULD be limited without limiting anything.
# Start with "on", watch /var/log/nginx/error.log for "limiting requests ... dry run",
# then flip to off. (nginx >= 1.17.1.)
limit_req_dry_run off;

# --- anonymous microcache -----------------------------------------------------
# One shared cache for anonymous people AND crawlers (never vary content by bot:
# that is cloaking). Session/Authorization/token requests bypass it entirely, so no
# logged-in page is ever stored. 500 MB ≈ tens of thousands of pages; 7-day idle TTL.
proxy_cache_path /var/cache/nginx/openradar levels=1:2 keys_zone=radar_cache:20m
                 max_size=500m inactive=7d use_temp_path=off;

# A request is anonymous only without a session cookie, an Authorization header
# (Nostr/Bearer) or an x-radar-token header (admin/API). A cookie header that merely
# lacks radar_session (e.g. only the language cookie) still counts as anonymous.
map $http_cookie $radar_no_session {
    default                 1;
    "~*radar_session="      0;
}
map $http_authorization $radar_no_auth {
    default 0;
    ""      1;
}
map $http_x_radar_token $radar_no_token {
    default 0;
    ""      1;
}
map "$radar_no_session:$radar_no_auth:$radar_no_token" $radar_anon {
    "1:1:1" 1;
    default 0;
}

# Pages are localized (src/server/i18n.ts resolveLang): ?lang= in the URI, then the
# openradar_lang cookie, then Accept-Language. The cache key carries a language
# BUCKET so ru/en variants live under different keys. Correctness does not depend
# on the bucket being exact: the app sends "Vary: Accept-Language, Cookie,
# Accept-Encoding", and nginx only serves a stored variant when those request
# headers match it exactly — a bucket mismatch costs a MISS, never wrong content.
# ?lang= responses set a cookie, and nginx never stores Set-Cookie responses.
# Accept-Language bucket: ru for a leading ru/be/uk/kk token, en for any other
# language, ru when the header is absent or "*" (browsers and crawlers send tokens
# in preference order; exotic q-reordered headers fall through to Vary matching).
map $http_accept_language $radar_al_lang {
    default                 en;
    ""                      ru;
    "~*^\s*\*"              ru;
    "~*^\s*(ru|be|uk|kk)\b" ru;
}
map $cookie_openradar_lang $radar_lang {
    en      en;
    ru      ru;
    default $radar_al_lang;
}

# CACHE READ (bypass) is decided BEFORE the upstream answers: only request-side
# facts may enter it. $upstream_http_* is empty at that moment — putting it here
# would bypass the cache on every request (it would fill up and never hit).
map "$request_method:$radar_anon" $radar_cache_bypass {
    "GET:1"  "0";
    "HEAD:1" "0";
    default  "1";
}
# CACHE WRITE (no_cache) is decided AFTER the upstream answers: the app must also
# say "public" (lead cards, the feed, sitemap, market datasets). nginx additionally
# honours private/no-store/no-cache and Set-Cookie natively; this map is the belt
# to those suspenders — a guest page is never stored without the app saying public.
map $upstream_http_cache_control $radar_cc_public {
    default       0;
    "~*public"    1;
}
map "$request_method:$radar_anon:$radar_cc_public" $radar_no_cache {
    "GET:1:1"  "0";
    "HEAD:1:1" "0";
    default    "1";
}

# Cache hit/miss observability: a dedicated log with the cache status as the last field.
log_format radar_cache '$remote_addr [$time_local] "$request" $status '
                       '"$http_user_agent" cache=$upstream_cache_status';
