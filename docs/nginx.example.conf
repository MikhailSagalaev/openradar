# nginx in front of an openradar hub. Replace example.com with your domain and 8787 with
# RADAR_HOST_PORT from .env. Get the certificate with:
#   certbot --nginx -d example.com -d www.example.com
# Check and reload: nginx -t && systemctl reload nginx
#
# Bot budgets + the anonymous microcache live in docs/nginx-bots.conf:
# install it to /etc/nginx/conf.d/openradar-bots.conf first (http-level maps/zones).

# Per-IP request rate for pages and the API (the app limits ingest and votes itself).
limit_req_zone $binary_remote_addr zone=openradar_pages:10m rate=10r/s;

# www and http go to https://example.com: one address for people and search engines.
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The app takes up to 10 MB on /v2/events and ingest; nginx defaults to 1 MB.
    client_max_body_size 10m;

    # Over-budget crawlers get a polite 429 with Retry-After, not a 503/403.
    # Set here (server level), NOT at http level in nginx-bots.conf: a shared box
    # may already define limit_req_status there (duplicate http directive = nginx -t fails).
    limit_req_status 429;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # robots.txt is never limited or cached: a 4xx here reads as "no rules" (RFC 9309).
    location = /robots.txt {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # nginx's own limit_req 429s become this polite page. Upstream (app) 429s pass
    # through untouched as JSON: proxy_intercept_errors stays off (the default).
    location @radar_slow_down {
        default_type text/plain;
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store" always;
        return 429 "Too many requests. Please retry after 60 seconds.\n";
    }

    # Server-Sent Events (radar/2 feed stream): no buffering, no cache, long reads.
    location /v2/stream {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        # Per-IP backstop for everyone; per-vendor budgets only bite classified crawlers
        # (empty keys are not counted). People sit far below all of these.
        limit_req zone=openradar_pages burst=60 nodelay;
        limit_req zone=radar_ai_search burst=20 nodelay;
        limit_req zone=radar_ai_train burst=10 nodelay;
        limit_req zone=radar_ai_user burst=20 nodelay;
        limit_req zone=radar_seo_tools burst=3 nodelay;
        error_page 429 = @radar_slow_down;

        # Anonymous microcache: one upstream render per URL per TTL, stale served while
        # revalidating or during an origin hiccup. Signed-in/token requests bypass it.
        #
        # READ (bypass) uses request-side facts only — $upstream_http_* is still empty
        # when bypass is evaluated. WRITE (no_cache) additionally requires the app to
        # say "public". Mixing the two into one variable makes the cache never hit.
        #
        # The key carries the resolved language bucket (cookie/Accept-Language, see
        # nginx-bots.conf); the app's "Vary: Accept-Language, Cookie, Accept-Encoding"
        # makes nginx store per-header variants on top, so gzip/identity and cookie
        # states can never mix either. Bots and anonymous people share one cache —
        # content never varies by user-agent (that would be cloaking).
        proxy_cache radar_cache;
        proxy_cache_key "$scheme$host$request_uri:$radar_lang";
        proxy_cache_methods GET HEAD;
        proxy_cache_bypass $radar_cache_bypass;
        proxy_no_cache $radar_no_cache;
        proxy_cache_valid 200 301 302 60s;
        proxy_cache_valid 404 30s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 15s;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_revalidate on;
        add_header X-Cache-Status $upstream_cache_status always;
        access_log /var/log/nginx/openradar-cache.log radar_cache;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
