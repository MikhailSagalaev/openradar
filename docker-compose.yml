services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: radar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-radar}
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar_mesh_secret_2026}
    volumes:
      - radar_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radar} -d ${POSTGRES_DB:-radar}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  radar:
    build: .
    container_name: radar_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RADAR_HOST_PORT:-8787}:8787"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://radar:radar_mesh_secret_2026@postgres:5432/radar}
      - RADAR_ADMIN_TOKEN=${RADAR_ADMIN_TOKEN:-012345678901234567890123456789012}
      - RADAR_PUBLIC_READ=true
      - PORT=8787
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  radar_pgdata:
