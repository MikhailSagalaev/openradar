services:
  postgres:
    # A new major version takes a new volume: scripts/pg-upgrade.sh moves the data over.
    # ParadeDB bundles Tantivy BM25 (pg_search), pg_analytics and pgvector in PostgreSQL.
    image: ${RADAR_PG_IMAGE:-paradedb/paradedb:latest-pg18}
    container_name: radar_postgres
    restart: unless-stopped
    mem_limit: ${RADAR_PG_MEM_LIMIT:-1g}
    command: postgres -c shared_preload_libraries=pg_search
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-radar}
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (openssl rand -hex 24)}
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker.
      - radar_pgdata18:/var/lib/postgresql
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radar} -d ${POSTGRES_DB:-radar}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  radar:
    build: .
    container_name: radar_app
    restart: unless-stopped
    # A ceiling well above the usual 400–700 MB: the hub may share its server, and a runaway
    # process must not take the neighbours' memory. The heap stops a little below it.
    mem_limit: ${RADAR_MEM_LIMIT:-2g}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RADAR_HOST_PORT:-8787}:8787"
    environment:
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in .env}
      - RADAR_ADMIN_TOKEN=${RADAR_ADMIN_TOKEN:?Set RADAR_ADMIN_TOKEN in .env (openssl rand -hex 32)}
      - RADAR_PUBLIC_READ=${RADAR_PUBLIC_READ:-true}
      - RADAR_MODE=${RADAR_MODE:-node}
      - PORT=8787
      - NODE_ENV=production
      - NODE_OPTIONS=${RADAR_NODE_OPTIONS:---max-old-space-size=1536}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # PostgreSQL 17 data of 0.42 and earlier; kept for a rollback, unused by the services.
  radar_pgdata:
  radar_pgdata18:
