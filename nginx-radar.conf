# Nginx configuration for the OpenRadar hub (openradar.fun)
# Разместить в: /etc/nginx/sites-available/openradar.fun
# Активировать: ln -s /etc/nginx/sites-available/openradar.fun /etc/nginx/sites-enabled/
# Сертификат (после того как DNS укажет на сервер):
#   certbot --nginx -d openradar.fun -d www.openradar.fun
# Проверить: nginx -t && systemctl reload nginx
# Порт в proxy_pass должен совпадать с RADAR_HOST_PORT в .env.

# www и http ведут на https://openradar.fun: один адрес для людей и поисковиков.
server {
    listen 80;
    listen [::]:80;
    server_name openradar.fun www.openradar.fun;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://openradar.fun$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.openradar.fun;

    ssl_certificate /etc/letsencrypt/live/openradar.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openradar.fun/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://openradar.fun$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name openradar.fun;

    ssl_certificate /etc/letsencrypt/live/openradar.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openradar.fun/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Server-Sent Events (radar/2 feed stream): no buffering, long reads.
    location /v2/stream {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
