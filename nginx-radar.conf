# Nginx Configuration for OpenRadar (openradar.fun)
# Разместить в: /etc/nginx/sites-available/openradar.fun
# Активировать: ln -s /etc/nginx/sites-available/openradar.fun /etc/nginx/sites-enabled/
# Настроить SSL сертификат через Certbot (после того как DNS укажет на сервер):
#   certbot --nginx -d openradar.fun -d www.openradar.fun
# Проверить: nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name openradar.fun www.openradar.fun;

    # Уберите, когда сайт готов к индексации
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Server-Sent Events (radar/2 feed stream): no buffering, long reads.
    location /v2/stream {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        # Порт должен совпадать с RADAR_HOST_PORT в .env
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60;
        proxy_connect_timeout 60;
    }
}
